name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$VERSION"
            exit 1
          fi
          echo "VSIX=rockide-vscode-$VERSION.vsix" >> "$GITHUB_ENV"

      - name: Package
        run: npx vsce package -o "$VSIX"

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath "$VSIX" --skip-duplicate --oidc

      - name: Publish to Open VSX
        run: npx ovsx publish "$VSIX" --skip-duplicate --trusted-publishing

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "$VSIX" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
